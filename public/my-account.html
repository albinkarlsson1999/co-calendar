<!DOCTYPE html>
<html lang="en">

<head>
    <title>Welcome - Login & Register</title>
    <script src="./JavaScript/LoginAuthenticator.js" defer></script>
    <script src="./JavaScript/my-account.js" defer></script>
    <link rel="stylesheet" href="./CSS/my-account-style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>

<body>
    <div class="center-box">
        <div id="backdrop" class="backdrop"></div>

        <div id="popup-window" class="popup-window">

            <h2 id="popup-window-header">empty</h2>
            <p id="popup-window-description" style="margin-bottom: 1px;">empty</p>

            <section id="popup-window-input-container" style="margin: 10px; display: flex;"></section>

            <section id="popup-window-request-list">
                <ul id="request-list">
                </ul>
            </section>

            <section id="popup-window-button-container"></section>

            <p id="popup-window-error-message" style="color: red;"></p>
        </div>

        <h3 class="title">My Account</h3>
        <section id="main-container" class="container">
            <button id="change-name-button" class="interract-button">Change name</button>
            <button id="change-password-button" class="interract-button">Change password</button>
            <button id="share-requests-button" class="interract-button">Share requests</button>
            <button id="show-active-shares" class="interract-button">Active shares</button>
            <button id="delete-button" class="interract-button">Delete account</button>
            <button id="back-button" class="interract-button">Back</button>
        </section>

    </div>
</body>

</html>
