<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome - Login & Register</title>
    <link rel="stylesheet" href="login-registry-style.css">
</head>

<body>
    <div class="center-box">
        <section id="register-box" class="container">
        <h3 class="title">REGISTER NEW USER</h3>
        
            <form id="register-form" class="input-form">

                <label for="first-name" class="hidden">First Name:</label>
                <input type="text" id="first-name" placeholder="First name" class="input-field" required>

                <label for="last-name" class="hidden">Last Name:</label>
                <input type="text" id="last-name" placeholder="Last name" class="input-field" required>

                <label for="email" class="hidden">Email:</label>
                <input type="email" id="email" placeholder="email" class="input-field" required>

                <label for="password" class="hidden">Password:</label>
                <input type="password" id="password" placeholder="password" class="input-field" required>

                <button type="submit" class="submit-button">Submit</button>
                <button type="button" class="register-button" onclick="window.location.href='/login.html'">Back</button>
            </form>
        </section>
    </div>

    <script>
        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const firstName = document.getElementById("first-name").value;
            const lastName = document.getElementById("last-name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log(data.message);

                    window.location.href = "/login.html";
                } else {
                    const errorData = await response.json();
                    const errorParagraph = document.createElement("p");
                    errorParagraph.textContent = errorData.error || "Registration failed. Please try again.";
                    document.getElementById("error-message").appendChild(errorParagraph);
                }
            } catch (error) {
                console.error("error logging in:", error);
                const errorParagraph = document.createElement("p");
                errorParagraph.textContent = "An error occurred. Please try again.";
                document.getElementById("error-message").appendChild(errorParagraph);
            }
        });
    </script>
</body>

</html>
